<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Личный сайт Виктора. Скоро открытие.">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="site-version" content="1">
  <title>Сайт Виктора — скоро открытие</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23283b31'/%3E%3Cpath d='M17 18l15 30 15-30' fill='none' stroke='%23f5f2e9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --paper: #f5f2e9; --ink: #283b31; --muted: #5c695f; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body { margin: 0; min-height: 100svh; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .page { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(24px, 5vw, 72px); }
    header { display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .04em; }
    .mark { width: 30px; height: 30px; flex: none; }
    main { width: min(100%, 1100px); align-self: center; padding-block: 72px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 28px; color: var(--muted); font-size: 13px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #557b59; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(54px, 9.2vw, 132px); font-weight: 400; line-height: 1.05; letter-spacing: -.055em; }
    .soon { margin: 28px 0 0; font-size: clamp(22px, 3.2vw, 40px); font-weight: 400; line-height: 1.3; letter-spacing: -.025em; }
    footer { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; border-top: 1px solid #ced2c7; padding-top: 22px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    @media (max-width: 480px) { main { padding-block: 64px; } .eyebrow { margin-bottom: 22px; } footer { flex-direction: column; gap: 4px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 10l7 14 7-14" fill="none" stroke="#f5f2e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>victorlapukhov.com.ru</span>
    </header>
    <main>
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Личный сайт</p>
      <h1>Сайт Виктора.</h1>
      <p class="soon">Скоро открытие.</p>
    </main>
    <footer><span>Место для новых идей и знакомств.</span><span>До скорой встречи</span></footer>
  </div>
</body>
</html>
